<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RayAI · AI创作平台</title><link rel="icon" type="image/png" href="./rayai-icon.png?v=2"><link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?v=2"><link rel="apple-touch-icon" href="./rayai-icon.png?v=2"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./simple.css"><link rel="stylesheet" href="./chat.css"><link rel="stylesheet" href="./chat-v2.css"><link rel="stylesheet" href="./chat-v3.css"></head>
<body><div class="app-shell" inert><aside id="sidebar" class="chat-sidebar"><div class="side-brand"><img class="brand-icon" src="./rayai-icon.png" alt=""><strong>RayAI</strong></div><button id="new-chat" class="new-chat" type="button"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新聊天</button><div class="side-caption">我的对话</div><nav id="chat-list" aria-label="对话列表"></nav><div class="side-foot">对话保存在当前浏览器</div></aside><div id="sidebar-shade" class="sidebar-shade" hidden></div>
<main class="chat-main"><header class="chat-header"><button id="sidebar-toggle" class="icon-button" type="button" aria-label="打开对话列表" aria-controls="sidebar" aria-expanded="false"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div id="chat-title" class="chat-title">新聊天</div><div class="account-area"><button id="account-toggle" class="header-button account-toggle" type="button" aria-label="用户菜单" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4 3.1-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg></button><div id="account-menu" class="account-menu" hidden><button id="new-profile" type="button">添加自定义模型</button><button id="export-backup" type="button">导出对话备份</button><button id="import-backup" type="button">导入对话备份</button><button id="login-entry" type="button">登录注册</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div></div></header>
<section id="conversation" class="conversation" aria-label="当前对话"><div id="welcome" class="welcome"><h1>想生成什么图片？</h1><p>描述画面，或添加参考图开始创作。</p></div><div id="turns" class="turns"></div></section>
<div class="composer-wrap"><div id="message" class="message" role="status" hidden></div><div class="composer composer-glow"><span class="composer-edge-light" aria-hidden="true"></span><div id="file-list" class="file-list" aria-label="待发送的参考图" hidden></div><div class="composer-input"><button id="empty-add-image" class="add-image" type="button" aria-label="添加参考图" title="添加参考图">＋</button><textarea id="prompt" rows="3" placeholder="粘贴或上传参考图，描述你想生成的图片…"></textarea></div><input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><div class="composer-toolbar"><div class="toolbar-left"><span id="mode-hint" class="mode-hint">图片生成</span><select id="profile-select" aria-label="使用模型"></select><button id="settings-toggle" class="toolbar-button" type="button" aria-controls="quick-params" aria-expanded="false">画面设置</button></div><button id="generate" class="send-button" type="button" aria-label="发送生成请求">↑</button></div><section id="quick-params" class="quick-params" aria-label="画面设置" inert></section></div></div>
<dialog id="model-dialog" aria-labelledby="dialog-title">
  <div class="dialog-header"><div><h2 id="dialog-title">添加自定义模型</h2><p>填写 API 信息，网站会尝试读取生图参数。</p></div><button id="close-dialog" class="close-btn" type="button" aria-label="关闭"><svg class="sidebar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="fields">
    <div class="model-section">
      <div class="model-section-heading"><h3>接口信息</h3><button id="add-another-profile" class="secondary" type="button">添加另一个模型</button></div>
      <label>模型 ID<input id="model" placeholder="例如 gpt-image-2.6-sunburst"></label>
      <label>API 地址<input id="base-url" placeholder="https://api.muzeai.top/v1"></label>
      <div class="model-key-field"><label for="api-key">API Key</label><div class="key-wrap"><input id="api-key" type="password" autocomplete="off" aria-describedby="model-key-hint" placeholder="粘贴你的密钥"><button id="toggle-key" type="button">显示</button></div><p id="model-key-hint" class="hint">仅保存在当前浏览器，清除网站数据时删除。</p></div>
    </div>
    <div class="model-section">
      <div class="model-section-heading"><h3>生图参数</h3><button id="read-params" class="secondary" type="button">读取接口参数</button></div><p id="discover-status" class="helper" role="status"></p>
      <details class="advanced"><summary>查看或修改读取到的参数</summary><div id="params"></div><button id="add-field" class="text-btn" type="button">添加参数</button><details class="request-preview"><summary>查看请求参数</summary><pre id="preview"></pre></details></details>
    </div>
    <div class="button-row"><button id="delete-profile" class="quiet" type="button">删除模型</button><button id="save-profile" class="primary" type="button">保存模型</button></div>
  </div>
</dialog>
<dialog id="invite-dialog" class="invite-dialog" aria-label="内测邀请码"><h2>欢迎使用 RayAI</h2><p>请输入内测邀请码继续使用。</p><form id="invite-form"><input id="invite-code" type="password" autocomplete="off" placeholder="内测邀请码" required><button type="submit">进入网站</button></form><p id="invite-error" role="alert"></p></dialog>
<dialog id="confirm-dialog"><h2>删除这个对话？</h2><p>对话中的文字和图片也会从当前浏览器删除。</p><div class="confirm-actions"><button id="cancel-delete" class="secondary">取消</button><button id="confirm-delete" class="danger">删除对话</button></div></dialog>
<dialog id="image-viewer" aria-label="查看生成图片"><div class="viewer-toolbar"><span class="viewer-desktop-hint">滚轮缩放 · 放大后按住左键或右键拖动 · 右键单击打开菜单</span><span class="viewer-mobile-hint">点击空白处关闭</span><div><button id="viewer-reset" type="button">重置大小</button><button id="viewer-close" type="button" aria-label="关闭图片">×</button></div></div><div id="viewer-stage" class="viewer-stage"><img id="viewer-image" alt="放大的生成图片"></div><div id="viewer-zoom" class="viewer-zoom">100%</div></dialog><div id="image-menu" class="image-menu" role="menu" hidden><button type="button" data-action="download" role="menuitem">下载图片</button><button type="button" data-action="copy" role="menuitem">复制图片</button><button type="button" data-action="attach" role="menuitem">添加图片到对话</button></div>
</main></div>
<div id="connection-screen" class="connection-screen" aria-label="连接生图服务">
  <canvas id="connection-aurora" class="connection-aurora" aria-hidden="true"></canvas>
  <div class="connection-content">
    <strong id="connection-percent" class="connection-percent" role="progressbar" aria-label="生图服务连接进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</strong>
    <p id="connection-status" class="connection-error" role="alert" hidden></p>
    <button id="connection-retry" class="connection-retry" type="button" hidden>重试</button>
  </div>
</div>
<script>window.addEventListener('load',()=>setTimeout(()=>{if(document.documentElement.dataset.appReady)return;const status=document.getElementById('connection-status');status.textContent='页面加载失败';status.hidden=false;const retry=document.getElementById('connection-retry');retry.hidden=false;retry.onclick=()=>location.reload();},6000));</script><script src="./rayai-config.js"></script><script type="module" src="./chat-app.js"></script></body></html>
