<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RayAI · AI创作平台</title><link rel="icon" type="image/png" href="./rayai-icon.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./simple.css"><link rel="stylesheet" href="./chat.css"><link rel="stylesheet" href="./chat-v2.css"><link rel="stylesheet" href="./chat-v3.css"></head>
<body><div class="app-shell"><aside id="sidebar" class="chat-sidebar"><div class="side-brand"><img class="brand-icon" src="./rayai-icon.png" alt=""><strong>RayAI</strong></div><button id="new-chat" class="new-chat">＋ 新聊天</button><div class="side-caption">我的对话</div><nav id="chat-list" aria-label="对话列表"></nav><div class="side-foot">对话保存在当前浏览器</div></aside><div id="sidebar-shade" class="sidebar-shade" hidden></div>
<main class="chat-main"><header class="chat-header"><button id="sidebar-toggle" class="icon-button" aria-label="打开对话列表">☰</button><div id="chat-title" class="chat-title">新聊天</div><div class="account-area"><button id="account-toggle" class="header-button account-toggle" type="button" aria-label="用户菜单" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4 3.1-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg></button><div id="account-menu" class="account-menu" hidden><button id="new-profile" type="button">添加自定义模型</button><button id="export-backup" type="button">导出对话备份</button><button id="import-backup" type="button">导入对话备份</button><button id="login-entry" type="button">登录注册</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div></div></header>
<section id="conversation" class="conversation" aria-label="当前对话"><div id="welcome" class="welcome"><div class="welcome-mark">✦</div><h1>想生成什么图片？</h1><p>描述画面，或添加参考图开始创作。</p></div><div id="turns" class="turns"></div></section>
<div class="composer-wrap"><div id="message" class="message" role="status" hidden></div><div class="composer"><div id="file-list" class="file-list" aria-label="待发送的参考图" hidden></div><div class="composer-input"><button id="empty-add-image" class="add-image" type="button" aria-label="添加参考图" title="添加参考图">＋</button><textarea id="prompt" rows="3" placeholder="粘贴或上传参考图，描述你想生成的图片…"></textarea></div><input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><div class="composer-toolbar"><div class="toolbar-left"><span id="mode-hint" class="mode-hint">图片生成</span><select id="profile-select" aria-label="使用模型"></select><button id="settings-toggle" class="toolbar-button" type="button">画面设置</button></div><button id="generate" class="send-button" type="button" aria-label="发送生成请求">↑</button></div><div id="quick-params" class="quick-params" hidden></div></div></div>
<dialog id="model-dialog"><div class="dialog-header"><div><h2 id="dialog-title">添加自定义模型</h2><p>填写 API 信息，网站会尝试读取生图参数。</p></div><button id="close-dialog" class="close-btn" aria-label="关闭">×</button></div><div class="fields"><button id="add-another-profile" class="secondary" type="button">＋ 添加另一个自定义模型</button><label>模型 ID<input id="model" placeholder="例如 gpt-image-2.6-sunburst"></label><label>API 地址<input id="base-url" placeholder="https://api.muzeai.top/v1"></label><label>API Key <span class="hint">保存后留在当前浏览器，清除网站数据时删除</span><div class="key-wrap"><input id="api-key" type="password" autocomplete="off" placeholder="粘贴你的密钥"><button id="toggle-key" type="button">显示</button></div></label><button id="read-params" class="secondary">读取接口参数</button><p id="discover-status" class="helper"></p><details class="advanced"><summary>查看或修改读取到的参数</summary><div id="params"></div><button id="add-field" class="text-btn">＋ 添加参数</button><details class="request-preview"><summary>查看请求参数</summary><pre id="preview"></pre></details></details><div class="button-row"><button id="save-profile" class="primary">保存模型</button><button id="delete-profile" class="quiet">删除模型</button></div></div></dialog>
<dialog id="invite-dialog" class="invite-dialog" aria-label="内测邀请码"><h2>欢迎使用 RayAI</h2><p>请输入内测邀请码继续使用。</p><form id="invite-form"><input id="invite-code" type="password" autocomplete="off" placeholder="内测邀请码" required><button type="submit">进入网站</button></form><p id="invite-error" role="alert"></p></dialog>
<dialog id="confirm-dialog"><h2>删除这个对话？</h2><p>对话中的文字和图片也会从当前浏览器删除。</p><div class="confirm-actions"><button id="cancel-delete" class="secondary">取消</button><button id="confirm-delete" class="danger">删除对话</button></div></dialog>
<dialog id="image-viewer" aria-label="查看生成图片"><div class="viewer-toolbar"><span class="viewer-desktop-hint">滚轮缩放 · 放大后按住左键或右键拖动 · 右键单击打开菜单</span><span class="viewer-mobile-hint">点击空白处关闭</span><div><button id="viewer-reset" type="button">重置大小</button><button id="viewer-close" type="button" aria-label="关闭图片">×</button></div></div><div id="viewer-stage" class="viewer-stage"><img id="viewer-image" alt="放大的生成图片"></div><div id="viewer-zoom" class="viewer-zoom">100%</div></dialog><div id="image-menu" class="image-menu" role="menu" hidden><button type="button" data-action="download" role="menuitem">下载图片</button><button type="button" data-action="copy" role="menuitem">复制图片</button><button type="button" data-action="attach" role="menuitem">添加图片到对话</button></div>
</main></div><script>window.addEventListener('load',()=>setTimeout(()=>{if(document.documentElement.dataset.appReady)return;const message=document.getElementById('message');message.hidden=false;message.textContent='页面未能完整加载，请刷新页面。';},6000));</script><script src="./rayai-config.js"></script><script type="module" src="./chat-app.js"></script></body></html>
